\* SCOPE NOTE (round-12): DIR_DROP = FALSE here. The stale-port drop is
\* round-11 C-1's surface and is covered at 2 ECs by dirf6/dirf6fix,
\* where it is the defect's own premise. Enabling it at 3 ECs multiplies
\* the space by C-1's five new per-EC fields without adding coverage --
\* measured: past 100M distinct states and climbing. This config's
\* question is whether the self-mark closes 3-CYCLES, which the drop
\* path has nothing to do with.
\* THE QUESTION THAT DECIDES SUFFICIENCY (round-7 maintainer proposal):
\* symmetric-suspend rejection is PAIRWISE -- a suspender checks whether
\* its own directive is already claimed by its target. That detects
\* 2-cycles. A 3-cycle (a suspends b, b suspends c, c suspends a) passes
\* every pairwise check individually. 2 cores x 3 ECs, directive only,
\* CYCLE_REJECT = "self". If InvNoSuspendCycle3 is VIOLATED here, the
\* mechanism closes the shape that was found, not the class.
SPECIFICATION SpecDirNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2, e3}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = FALSE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvNoSuspendCycle2
INVARIANT InvNoSuspendCycle3
