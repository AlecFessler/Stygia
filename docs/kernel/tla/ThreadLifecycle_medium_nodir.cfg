\* DEFAULT MEDIUM SPLIT (round-16 dpin/dres): 2 cores, 3 Threads,
\* TERM_BUDGET = 2, all non-directive features enabled, symmetry.
\*
\* This is the default aggregate safety replacement for the former full
\* `medium` row. The full row (`ThreadLifecycle_medium.cfg`) remains on disk
\* as an extended measurement target, but it is not default evidence:
\* with dpin/dres it was stopped after more than an hour at ~598M
\* generated / ~133.6M distinct / ~11.9M queued states.
\*
\* What is deliberately NOT covered here: directive states/actions and
\* their invariants (`InvNoArmedFreed`, `InvNoForeignDisarm`,
\* `InvNoFalseSuspendSuccess`). Those facts move to the directive-specific
\* rows (`diraba`, `dirf6`, `dirf6fix`, `t1d`/`pr4d`) and to `small`,
\* which still runs all features with creation at 2 Threads.
SPECIFICATION SpecNF
SYMMETRY Symm
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2, e3}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = TRUE
  REQUEUE_ON = TRUE
  FASTPATH = TRUE
  RV_ON = TRUE
  DIR_ON = FALSE
  PINLOCK_ON = TRUE
  S7_ON = TRUE
  DROP_BUDGET = 1
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
INVARIANT TypeOK
INVARIANT InvS1
INVARIANT InvS3
INVARIANT InvS4Holder
INVARIANT InvS4Pended
INVARIANT InvPinCells
INVARIANT InvHopUnpinned
INVARIANT InvNoLostOneShot
INVARIANT InvHopNoClaimedOutgoing
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
INVARIANT InvNoPreemptedLockHolder
INVARIANT InvNoSuspendCycle2
INVARIANT InvNoSuspendCycle3
