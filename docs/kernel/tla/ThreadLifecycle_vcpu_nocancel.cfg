\* stygia-8xl falsifier: remote retire of a guest-current vCPU without an
\* arch cancel/kick leaves current_thread = retired while the owner remains in
\* guest execution. InvRetiredVcpuCancelled must fire.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1}
  Threads = {e1}
  NULL = NULL
  VCPU_THREADS = {e1}
  VCPU_CANCEL = FALSE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
INVARIANT TypeOK
INVARIANT InvVcpuModeCoherent
INVARIANT InvRetiredVcpuCancelled
