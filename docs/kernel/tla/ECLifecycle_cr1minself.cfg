\* SYMMETRIC-SUSPEND REJECTION experiment (round-7 maintainer proposal).
\* Same focused LiveSuspender scope as crfals, but CYCLE_REJECT = "self".
\* The spec is SpecSus, LiveSuspender's per-property fairness set:
\* FairCPU, FairUnwind, FairDisp, FairTick and FairSpinDir only. Neither
\* N6 assumption is present: no SF(DirArm) (face i) and NO
\* AlignmentAssumption (face ii). A PASS here retires both at the same
\* no-drop calibration scope where crfals must fail.
SPECIFICATION SpecSus
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = FALSE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvPmuTailOwned
INVARIANT InvPmuNoReleasedHw
INVARIANT InvNoUAF
PROPERTY LiveSuspender
