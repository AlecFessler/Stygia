\* SYMMETRIC-SUSPEND REJECTION experiment (round-7 maintainer proposal).
\* Same scope as c1min, but CYCLE_REJECT = TRUE and the spec is
\* SpecFairN3 -- N3's two per-spin SFs ONLY. Neither N6 assumption is
\* present: no SF(DirArm) (face i) and NO AlignmentAssumption (face ii),
\* so there is no raw []<> tableau. A PASS here retires both.
SPECIFICATION SpecFairN3
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveSuspender
