\* Focused PMU reverse-coherence falsifier.
\* PMU_SAFE_MIGRATION = FALSE reproduces the reviewed bug class: a remote
\* non-caller perfmon_start/read resumes after a PMU drain and writes
\* hw_core = NULL while a core's pmu_hw_refs slot still names that state.
\* InvPmuHwCoreRefCoherent must fire on the reverse phw -> hw direction.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = FALSE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvPmuHwCoreRefCoherent
