\* EXTENDED / SLOW ONLY (round-16 dpin/dres): this former default
\* aggregate is no longer default evidence. The current full directive
\* shape was stopped after more than an hour at ~598M generated /
\* ~133.6M distinct / ~11.9M queued states. The default replacement is
\* ECLifecycle_medium_nodir.cfg; directive coverage is split across
\* small, diraba, dirf6/dirf6fix and t1d/pr4d.
\*
\* SCOPE NOTE 2 (round-13): CR_BUDGET = 0. Round-11 C-1 added a slab
\* `gen` that ADVANCES on every finalize and is INHERITED on reuse, so
\* creation is now the dominant state multiplier at 3 ECs -- measured:
\* past 143M distinct with a still-GROWING queue, against 32M before
\* the field existed. Slab reuse is exercised at 2 ECs by dirf6 and
\* dirf6fix, which is where C-1 actually lives and where reuse is the
\* defect's own premise. What this config is FOR -- all features at
\* three ECs -- is unaffected.
\* SCOPE NOTE (round-12): DIR_DROP = FALSE here. The stale-port drop is
\* round-11 C-1's surface and is covered at 2 ECs by dirf6/dirf6fix,
\* where it is the defect's own premise. Enabling it at 3 ECs multiplies
\* the space by C-1's five new per-EC fields without adding coverage --
\* measured: past 100M distinct states and climbing. This config's
\* question is whether the self-mark closes 3-CYCLES, which the drop
\* path has nothing to do with.
\* Revision 7 machine (= rev 6 semantics), medium scope: 2 cores, 3 ECs,
\* 2 retires, ALL features. Safety battery + deadlock check, symmetry.
\* unsound for liveness, so no PROPERTY lines here).
SPECIFICATION SpecNF
SYMMETRY Symm
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2, e3}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = TRUE
  REQUEUE_ON = TRUE
  FASTPATH = TRUE
  RV_ON = TRUE
  DIR_ON = TRUE
  PINLOCK_ON = TRUE
  S7_ON = TRUE
  DROP_BUDGET = 1
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = FALSE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS1
INVARIANT InvS3
INVARIANT InvS4Holder
INVARIANT InvS4Pended
INVARIANT InvPinCells
INVARIANT InvHopUnpinned
INVARIANT InvNoLostOneShot
INVARIANT InvHopNoClaimedOutgoing
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
INVARIANT InvNoArmedFreed
INVARIANT InvNoPreemptedLockHolder
INVARIANT InvNoSuspendCycle2
INVARIANT InvNoSuspendCycle3
INVARIANT InvNoForeignDisarm
INVARIANT InvNoFalseSuspendSuccess
