\* FALSIFIER crfals: the SAME obligation and the SAME fairness set as
\* cr1min, with symmetric-suspend rejection dialed OUT. This is the
\* revision-7 machine judged without its N6 assumptions, so it must
\* FAIL (Temporal properties violated) -- that failure is what proves
\* the rejection mechanism, not the assumptions, is carrying W5.
SPECIFICATION SpecFairN3
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "none"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveSuspender
