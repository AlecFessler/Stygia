\* FALSIFIER crfals: LiveSuspender with symmetric-suspend rejection dialed
\* OUT, under the per-property SpecSus fairness set and with the stale/bad
\* port owner-failure arm scoped out. This keeps the calibration focused on
\* the round-7 N6 lasso (two running ECs mutually suspending) after dpin+dres
\* made the old SpecFairN3/drop-bearing temporal phase too slow. It must
\* FAIL (Temporal properties violated).
SPECIFICATION SpecSus
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "none"
  TERM_ESCAPE = TRUE
  DIR_DROP = FALSE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveSuspender
