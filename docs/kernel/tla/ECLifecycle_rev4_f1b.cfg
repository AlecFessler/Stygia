\* VALIDATION GATE, round-4 F1, always-wait reading: the hop's retired arm
\* acquire-waits payload_done unconditionally (F1_MODE = "alwayswait", no W7
\* pre-wait). A retire whose origin was plain `parking` has no claimant and
\* therefore no payload_done writer: the owner core wedges at its hop.
\* Expected result: TLC reports "Deadlock reached" (deadlock detection ON).
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "alwayswait"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
