\* EXTENDED/MANUAL RUNG 3d -- LiveTerm (W3/W4) WITH THE DIRECTIVE.
\*
\* CURRENT STATUS (2026-08-03): preserved on disk as the full measured
\* t1d scope, but NOT a default gate and NOT a PASS. The current
\* dpin/dres/failed-result graph reached final temporal checking at
\* 1,548,068 distinct / 3,096,136 product states and then timed out. The
\* default directive-bearing LiveTerm gate is the bounded
\* ECLifecycle_t1d_min.cfg / ECLifecycle_pr4d_min.cfg pair.
\*
\* ============================ PAIRED CONFIG ============================
\* PARTNER: ECLifecycle_pr4d.cfg. Its CONSTANTS block is an EXACT MIRROR
\* of this one and MUST STAY THAT WAY -- edit the two together or not at
\* all. pr4d checks ProbeNoTermSuspendCycle at this full scope and MUST
\* FIRE before any future full t1d PASS can be cited. run.sh no longer
\* runs this pair by default; RUN_SLOW records this row as
\* measured-unconverged until re-measured.
\* =======================================================================
\*
\* WHY THIS RUNG EXISTS (revision 16). At revision 15 the LiveTerm ladder
\* had ZERO directive coverage: t1min, t1s and t1r are all
\* DIR_ON = FALSE, and t1full -- the only DIR_ON = TRUE rung -- no longer
\* converges (see the SCOPE NOTE in ECLifecycle_t1full.cfg: 8,131,498
\* distinct states / 16,262,996 product nodes, 17.0x its revision-11 size,
\* single-threaded temporal phase, past the 7200s cap). So the W3 -> W5 ->
\* W3 cycle of round-9 M-1 -- A terminates B while B suspends A -- had no
\* LiveTerm verdict at all at revision 15. This rung is where that
\* coverage lives now.
\*
\* THIS IS A NEW RUNG, NOT A CUT-DOWN t1full, and the difference is the
\* point. A cut re-checks something already covered; a rung REACHES
\* something not covered. The delta from t1s (rung 2, PASS 10,237) is
\* exactly ONE switch -- DIR_ON FALSE -> TRUE -- which is the minimum that
\* admits the directive protocol at all: DirSelfMark / DirClaim / DirArm /
\* DirLoop / DirConsume are gated on DIR_ON alone (DirClaim needs no
\* SUSPEND_ON), so this turns on the `dirW` half of pr4d's predicate while
\* changing nothing else. TERM_BUDGET = 2 supplies the `termW` half.
\*
\* WHY DIR_ON RATHER THAN A BUDGET CUT, measured rather than assumed. The
\* revision-11 -> revision-15 growth is driven by DIR_ON, not by
\* CR_BUDGET:
\*     large    DIR_ON=FALSE CR_BUDGET=0    68,733 ->    68,733   1.00x
\*     xlarge   DIR_ON=FALSE CR_BUDGET=0   732,044 ->   732,044   1.00x
\*     crfals   DIR_ON=TRUE  CR_BUDGET=0     1,768 ->    18,216  10.30x
\*     small    DIR_ON=TRUE  CR_BUDGET=1   181,326 -> 2,957,560  16.31x
\*     t1full   DIR_ON=TRUE  CR_BUDGET=1   477,468 -> 8,131,498  17.03x
\* The six fields revisions 11-13 added (gen, dgen, dlv, pok, dfs, dbad)
\* are ALL directive fields, so DIR_ON is the multiplier and CR_BUDGET
\* only roughly doubles it on top. Dropping CR_BUDGET alone buys ~1.7x
\* against the ~10x t1full needs -- which is why t1full gets an honest
\* UNCONVERGED and this rung gets built instead.
\*
\* WHAT COVERAGE IS LOST relative to t1full, stated as the discipline
\* requires -- these are things NO LiveTerm verdict at revision 15 covers:
\*   - RV_ON = FALSE: no rendezvous. A terminate-liveness failure that
\*     needs a rendezvous sender/receiver pair mid-delivery is unreachable
\*     here. (Rung t1r covers rendezvous, but WITHOUT the directive, so no
\*     single rung covers rendezvous AND the directive together.)
\*   - PINLOCK_ON = FALSE: no pin-class lock episodes. The N1 shape --
\*     suspenders in the W5 wait each holding a pin-class lock -- is not
\*     constructible here. (t1r covers pin locks without the directive.)
\*   - S7_ON = FALSE: the dead-domain filter route is not exercised.
\*   - CR_BUDGET = 0: NO SLOT IS EVER RECYCLED, so every shape that
\*     depends on a recycled slot is unreachable -- exactly the family
\*     gen/dgen exist to guard (round-10 C-D's directive ABA, round-11
\*     C-1's false SUCCESS). Those are covered by the diraba / dirf6 /
\*     dirf6fix gates and by the small and medium SAFETY runs, but by no
\*     liveness obligation at any scope. A terminate-liveness failure
\*     REQUIRING a recycled slot would be missed everywhere.
\*   - FASTPATH = FALSE: inherited from t1s; the fused shapes are not
\*     composed here.
\*
\* Under SpecTrm, LiveTerm's per-property MINIMAL fairness set, so a PASS
\* records exactly which assumptions it rests on: FairCPU, FairUnwind,
\* FairDisp, FairTick, FairSpinTerm -- and NOT FairFire, NOT FairSpinDir
\* (so the directive spinner gets NO strong-fairness help here), and
\* neither N6 assumption.
\*
\* ================= PRE-REGISTERED INTERPRETATION =======================
\* Written BEFORE this config was ever run, so the reading of the result
\* cannot be composed after seeing it. Revision 16.
\*
\* IF IT PASSES: LiveTerm holds with the directive protocol live, at this
\* scope, WITHOUT FairSpinDir -- i.e. terminate-liveness does not require
\* any strong-fairness assumption about the directive spinner. That is the
\* first directive-bearing LiveTerm verdict since revision 11 (rev-11
\* t1full: PASS, 477,468 states, 2,487s, on a machine that predates the
\* six fields revisions 11-13 added and the DirArm guard revision 15
\* corrected -- so it is NOT the same claim re-established, it is a new
\* one about the current machine).
\*
\* IF IT FAILS: that is a FIRST-CLASS FINDING and must be reported raw.
\* It would mean LiveTerm does NOT hold unless the directive spinner is
\* strongly fair -- and SpecTrm's exclusion of FairSpinDir is deliberate,
\* so this is not a modelling inconvenience to be patched. FairSpinDir is
\* SF on DirLoop; requiring it is a statement about what the KERNEL must
\* guarantee: that a W5 directive-suspender's re-check loop is eventually
\* scheduled. The honest responses are (a) make it an EXPLICIT assumption
\* in the W5 row of systems.md Sec 3.6, argued on its own merits like
\* Sec 3.6's other assumptions, or (b) change the design so the property
\* holds without it.
\* *** DO NOT ADD FairSpinDir TO THIS CONFIG TO MAKE IT GREEN. *** That
\* answers the question by assuming it away, which is precisely the move
\* round-7 C3 retired for the two N6 assumptions -- and the artifact's
\* standing result is that designing an assumption away beats carrying it.
\*
\* IF pr4d DOES NOT FIRE: this rung does not deliver what it was built
\* for. The W3 -> W5 -> W3 shape would be unreachable at this scope, this
\* config's PASS would be vacuous over it, and the PASS MUST NOT be cited
\* for round-9 M-1. In that case the rung needs re-scoping upward (restore
\* a feature and re-measure), not a footnote.
\* =======================================================================
SPECIFICATION SpecTrm
