\* VALIDATION GATE, round-4 F1, don't-wait reading: rev 4 conditioned the
\* hop's retired-arm payload_done wait on the hop's own prior observation of
\* `pended` -- a fact retire destroys. Read as don't-wait (F1_MODE =
\* "nowait": no W7 pre-wait, hop retired arm never waits), the owner
\* finalizes the EC while the 5b claimant is still writing payload.
\* Historical result: without target claim pins, TLC violated InvNoUAF.
\* Current target-pin parity makes this a clean stale-gate closure: the
\* pended claimant pins the target until payload_done/hld discharge, and
\* RetireEnabled waits pin = 0. Run with -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "nowait"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvNoUAF
