\* G14 focused 1-core/1-thread liveness and parked-queue safety.
\* Per-property MINIMAL fairness at 2 cores x 3 Threads (round-7 follow-up).
\* The verdict records exactly which assumptions it rests on.
SPECIFICATION SpecL3
CONSTANTS
  Cores = {c1}
  Threads = {e1}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = FALSE
  RESTART_ON = FALSE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT InvParkedQueueHasWake
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveReady
