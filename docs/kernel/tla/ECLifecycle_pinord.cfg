\* FALSIFIER pinord (round-7 CRITICAL C1): the pin_depth bump/acquire
\* ORDER. Revision 7 said only "incremented at claim-win and pin-class
\* acquire; decremented at discharge/release" and never ordered the bump
\* against the acquire. Pin-class locks are BY DEFINITION not IRQ-masked
\* at their EC-context acquire sites -- that property is what puts a class
\* in the set -- so `lock(); pin_depth += 1;`, the default an engineer
\* writes, leaves a live preemption point between the two: a tick lands
\* there, reads pin_depth == 0, wins the running -> parking(requeue) CAS,
\* and requeue-preempts a frame HOLDING the slab-class lock. Every other
\* allocator then spins IRQ-masked (W1) on a class whose holder sits
\* `ready`; if that holder is queued on a spinning core it is a hard
\* deadlock, and T2's ready x K row would inline-retire it on the
\* now-false argument "a requeue-preempted frame holds no lock at all".
\*
\* With PIN_BUMP_FIRST = FALSE that argument -- stated as invariant
\* InvNoPreemptedLockHolder -- must fail. Revision 8 closes it by making
\* the order normative (Sec 2.4 + the Sec 9.2 assert). Run with -deadlock
\* so a shallower artifact cannot shadow the targeted violation.
\*
\* SCOPE NOTE (honest): this gate covers the PIN-CLASS LOCK half of C1
\* only. The claim-side bump (which must sit inside the IRQ-masked
\* reaching-lock section that performs the claim CAS) is below this
\* model's granularity by construction -- W1 sections are single actions
\* -- so it is doc-normative and assert-enforced, not model-checked. See
\* README, finding C1.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = TRUE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = FALSE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvNoPreemptedLockHolder
