\* DEFAULT LADDER RUNG 3d-min -- LiveTerm (W3/W4) WITH the directive,
\* bounded to the smallest directive-bearing terminate scope expected to
\* converge after dpin/dres/failed-result semantics.
\*
\* ============================ PAIRED CONFIG ============================
\* PARTNER: ECLifecycle_pr4d_min.cfg. Its CONSTANTS block is an EXACT
\* MIRROR of this one and MUST STAY THAT WAY -- edit the two together or
\* not at all. pr4d_min checks ProbeNoTermSuspendCycle at this scope and
\* MUST FIRE; if it stops firing, this config's PASS is vacuous over the
\* W3 -> W5 -> W3 directive/terminate cycle and the gate is BLOCKED.
