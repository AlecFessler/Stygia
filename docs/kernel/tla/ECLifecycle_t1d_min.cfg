\* This is the default replacement for the former full t1d row, which is
\* preserved as ECLifecycle_t1d.cfg but is measured-unconverged on the
\* current graph. This row keeps dpin/dres/failed semantics and the
\* directive ownership/gen checks live, but removes unrelated multipliers:
\* no cross-EC non-directive suspend, fast path, rendezvous, pin-lock
\* episodes, S7 route, drop budget, or slot recycling.
