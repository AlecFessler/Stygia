\* stygia-8xl focused x86 SVM lifecycle contract: one vCPU can be
\* dispatched into guest mode, remotely retired, arch-cancelled, exit to
\* host, then discharge/finalize through the ordinary retired-current hop.
SPECIFICATION SpecL2
CONSTANTS
  Cores = {c1}
  ECs = {e1}
  NULL = NULL
  VCPU_ECS = {e1}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvVcpuModeCoherent
INVARIANT InvRetiredVcpuCancelled
INVARIANT InvS1
INVARIANT InvS3
INVARIANT InvPmuTailOwned
INVARIANT InvPmuNoReleasedHw
PROPERTY LiveRetired
PROPERTY LiveVcpuCancel
