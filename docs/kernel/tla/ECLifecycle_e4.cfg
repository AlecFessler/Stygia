\* FALSIFIER e4 (the pre-split tree's wait-park shape): with E4_AT_HOP =
\* FALSE, UserPark publishes the TERMINAL wait state (claimable-as-waiting)
\* before the hop, while the owner core is still on the EC's kstack --
\* exactly the window today's tree holds shut with a wake-side barrier
\* that Phase-3b measured as reached 856x/boot and entered 0 (a timing
\* zero, not a structural one). InvS3 (claimable => kstack-quiescent) must
\* fire within a handful of states; the `parking` interposition (edge 4's
\* claimability-at-the-hop) is what makes S3 structural. Run with
\* -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 1
  F1_MODE = "rev5"
  E4_AT_HOP = FALSE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS3
