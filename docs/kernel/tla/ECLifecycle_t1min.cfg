\* LADDER RUNG 1 for LiveTerm (W3/W4) — the property this artifact has
\* NEVER verified at any scope (rev 7: no verdict; rev 8: two runs killed
\* without converging; rev 9: q7 unconverged at 2c x 3e). Smallest useful
\* scope: 2 cores x 2 ECs, TERMINATE ONLY. Under SpecTrm, the
\* per-property MINIMAL fairness set for LiveTerm, so a PASS records
\* exactly which assumptions it rests on: FairCPU, FairUnwind, FairDisp,
\* FairTick, FairSpinTerm — and NOT FairFire, NOT FairSpinDir, and
\* neither N6 assumption.
