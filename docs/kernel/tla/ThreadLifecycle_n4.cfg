\* FALSIFIER N4 (revision-5 literal machine): rev 5 ordered the container
\* unwind INSIDE retire (step 3, after the CAS) and listed "container
\* unwind complete" as a finalize precondition -- but named no mechanism
\* making a ROUTED finalizer (the hop's wait-free retired arm) wait for
\* the retirer's unwind. With FIN_UNWIND = FALSE (revision 6's mechanism
\* absent), the hop finalizes a parking-row retiree while it is still
\* linked in its wait containers: InvS1's freed => unlinked clause fails.
\* Revision 6 closes this by DELETING retire's step 3 and making the
\* idempotent unwind finalize's first act (Sec 8.2 rev 6). This config
\* must keep violating InvS1 -- it is the resolution proof for that
\* mechanism. CR_BUDGET = 1 so the payoff trace (a recycled, still-linked
\* slot) is reachable, not only the flag violation. Run with -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 1
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = FALSE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT InvS1
