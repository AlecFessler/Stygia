\* NOTE (round-11 M-3): TERM_BUDGET = CR_BUDGET = 0 here is DELIBERATE.
\* The C-D ABA is drop-then-reclaim of a LIVE target and needs 3 Threads,
\* which is already the expensive part. Retire/finalize/slab-reuse is
\* covered at non-zero budgets by dirf6/dirf6fix (round-11 C-1), where
\* it is the defect's own premise. Raising the budgets HERE was tried
\* and blew the space past 268M states without adding coverage the
\* dirf6 pair does not already provide.
\* FALSIFIER diraba (round-10 C-D + M-A): the directive word is an ABA
\* once `dropped` is deleted, because the owner writes `armed -> none`
\* for BOTH consumption and a stale-port drop, and exclusivity holds only
\* while the word is non-`none`. With DIR_OWNED = FALSE the suspender's
\* loop breaks on a VALUE comparison (revision 10's rule) and its disarm
\* CAS is ungated, so: A arms B, B drops, C re-claims/arms B, and A is
\* now looping on — and able to disarm — C's directive, or about to
\* report SUCCESS for a suspension that was never delivered.
\* InvNoForeignDisarm must fire. Run with -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2, e3}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT InvNoForeignDisarm
