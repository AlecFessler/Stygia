\* G11 reachability: the finalizing/dead intermediate must occur before
\* slot zero. This probe does not imply that a live directive waiter can
\* observe it; the same-scope g11_pin safety check excludes that overlap.
\* TERM and CR budgets permit retirement and release. Run with -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 1
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  RESTART_ON = FALSE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT ProbeNoFinalizingDead
