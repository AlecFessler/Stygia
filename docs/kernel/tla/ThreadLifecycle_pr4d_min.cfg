\* DEFAULT PROBE pr4d-min -- TLC must VIOLATE this. It proves the
\* W3 -> W5 -> W3 configuration (A terminates B while B suspends A) is
\* actually REACHED at ThreadLifecycle_t1d_min.cfg's scope, so t1d_min's
\* LiveTerm PASS is not vacuous over the directive/terminate cycle.
\*
\* ============================ PAIRED CONFIG ============================
\* PARTNER: ThreadLifecycle_t1d_min.cfg. The CONSTANTS block below is an
\* EXACT MIRROR of that file's and MUST STAY THAT WAY -- edit the two
\* together or not at all. A scope change applied to t1d_min but not here
\* silently turns this probe into a statement about a DIFFERENT machine.
\* =======================================================================
SPECIFICATION SpecTermDirNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  RESTART_ON = FALSE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT ProbeNoTermSuspendCycle
