\* FALSIFIER mterm (round-8 CRITICAL C-1): MUTUAL TERMINATE.
\* A and B each hold a `term` handle to the other and both are running.
\* A retires B (B's kernel frame keeps running); B retires A; both enter
\* the W3 eviction wait for the other. A retired thread in a kernel frame is
\* moved by NOTHING — the requeue CAS fails on `retired`, and rule 3's
\* entry checks are user-boundary-gated only. Hard two-core deadlock.
\*
\* The tree guards `if (thread != caller ...)` (thread.zig:1028)
\* which covers SELF-terminate and NOT this: both cores pass `thread != caller`.
\* Revision 8's doc had no carve-out at all, so the tree was SAFER than
\* the design. With TERM_ESCAPE = FALSE this must reach a deadlock; the
\* rev-9 repair (a retired terminator abandons the wait) dissolves it.
\* Run WITHOUT -deadlock: the deadlock IS the expected violation.
