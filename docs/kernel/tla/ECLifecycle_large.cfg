\* Revision 7 machine (= rev 6 semantics), large scope: 3 cores, 3 ECs, 2 retires, with the rendezvous
\* window ON (the T2 parking x K+C surface at 3 cores). Directive / pin-lock
\* / S7 / creation are exercised at 2x2 and 2x3 (small, medium); enabling
\* everything at 3x3 is ~10^9 states and intractable -- the bounding note in
\* README.md records what this trims.
SPECIFICATION SpecNF
SYMMETRY Symm
CONSTANTS
  Cores = {c1, c2, c3}
  ECs = {e1, e2, e3}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = TRUE
  REQUEUE_ON = TRUE
  FASTPATH = TRUE
  RV_ON = TRUE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS1
INVARIANT InvS3
INVARIANT InvS4Holder
INVARIANT InvS4Pended
INVARIANT InvPinCells
INVARIANT InvHopUnpinned
INVARIANT InvNoLostOneShot
INVARIANT InvHopNoClaimedOutgoing
INVARIANT InvRetiredPdOrdered
INVARIANT InvPmuTailOwned
INVARIANT InvPmuNoReleasedHw
INVARIANT InvNoUAF
INVARIANT InvNoArmedFreed
INVARIANT InvNoPreemptedLockHolder
INVARIANT InvNoFalseSuspendSuccess
