\* Scope: Cores = {c1}; Threads = {e1}.
\* Positive checks retain LiveTeardown; probe and lost-ref configs are falsifiers.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1}
  Threads = {e1}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  RESTART_ON = TRUE
  G16_ON = TRUE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT ProbeNoRestartSuccess
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
