\* EXTENDED/MANUAL PROBE pr4d (revision 16) -- TLC must VIOLATE this. It proves the
\* W3 -> W5 -> W3 configuration (A terminates B while B suspends A) is
\* actually REACHED at ThreadLifecycle_t1d.cfg's full scope. The paired full
\* t1d row is currently measured-unconverged, so this probe is reachability
\* evidence for a manual row, not a default PASS certificate.
\*
\* ============================ PAIRED CONFIG ============================
\* PARTNER: ThreadLifecycle_t1d.cfg. The CONSTANTS block below is an EXACT
\* MIRROR of that file's and MUST STAY THAT WAY -- edit the two together
\* or not at all. A scope change applied to full t1d but not here silently
\* turns this probe into a statement about a DIFFERENT machine, and t1d's
\* future PASS would then rest on a certificate that no longer matches it.
\* The default battery uses ThreadLifecycle_t1d_min.cfg /
\* ThreadLifecycle_pr4d_min.cfg instead.
\* =======================================================================
\*
\* THE VIOLATION IS THE PASS. ProbeNoTermSuspendCycle asserts that no two
\* Threads are simultaneously in `termW` (a terminator's W3 eviction wait) and
\* `dirW` (the directive-suspender's W5 wait) naming each other. TLC
\* violating it exhibits the cycle, which is what makes t1d's PASS mean
\* something. If this probe ever stops firing, t1d's verdict must NOT be
\* cited as covering round-9 M-1 -- report the loss of coverage, do not
\* delete the probe (ThreadProbes.tla's standing rule).
\*
\* This is the same standard round-10 M-D applied to t1full via pr4: a
\* LiveTerm PASS billed as machine-checking the cycle is worth nothing if
\* the configuration is never reached in the states explored. t1full can
\* no longer converge at revision 15, so the certificate moves here with
\* the property it certifies.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = TRUE
  REQUEUE_ON = TRUE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
INVARIANT TypeOK
INVARIANT ProbeNoTermSuspendCycle
