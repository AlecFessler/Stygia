\* Focused PMU dispatch-tail/release lifetime check.
\* Keeps dispatch, retire, and PMU release enabled while disabling unrelated
\* wake/suspend/directive/creation multipliers so InvPmuNoReleasedHw can run
\* quickly after changes to the PMU lifetime abstraction.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 0
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvPmuTailOwned
INVARIANT InvPmuHwCoreRefCoherent
INVARIANT InvPmuNoReleasedHw
