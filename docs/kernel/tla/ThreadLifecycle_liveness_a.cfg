\* Liveness group A (L1 LiveParking, L2 LiveRetired, L6 LiveClaim) at 2x2,
\* ALL features. Runs under SpecFairCore: no per-spin SF -- the N3
\* scheduling assumptions are NOT needed for these properties, and passing
\* under weaker fairness is the stronger result. Properties are split into
\* attributable groups (A/B/C) so each run completes within budget and a
\* failure names its property; jointly the groups cover every temporal
\* obligation at this scope.
SPECIFICATION SpecFairCore
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = TRUE
  REQUEUE_ON = TRUE
  FASTPATH = TRUE
  RV_ON = TRUE
  DIR_ON = TRUE
  PINLOCK_ON = TRUE
  S7_ON = TRUE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 1
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveParking
PROPERTY LiveRetired
PROPERTY LiveClaim
