\* STALE-GATE CLOSURE dirf6 (round-11 C-1): before dpin, finalize's own
\* `slot zero` destroyed F6's `dead` marker, so the W5 break returned
\* SUCCESS for a TERMINATED target. Sec 5 edge 10 / Sec 8.2 order it
\* verbatim: release body writes `directive_state -> dead`, then
\* `slot zero + freelist` a few steps later in the SAME routine — and
\* `none` must be the all-zeroes encoding or a recycled slot would be
\* permanently unsuspendable (round-9 C-1).
\*
\* Trace: A arms B; A is requeue-preempted (Sec 2.5 measures this window
\* as a full quantum); B is terminated -> finalized -> zeroed; A resumes,
\* reads `none`, re-validates the PORT (alive, unchanged) and returns
\* SUCCESS. Correct return is E_TERM. With dpin, the running-target
\* directive waiter pins the target until ack/return, so the terminate /
\* finalize / reuse leg is blocked and InvNoFalseSuspendSuccess is
\* expected clean even with DIR_GENCHK = FALSE. NOTE the budgets: TERM and
\* CR stay non-zero as a stale-gate closure check that the old shape is
\* blocked by dpin, not hidden by scope. Run with -deadlock.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 1
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  PMU_SAFE_MIGRATION = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = FALSE
INVARIANT TypeOK
INVARIANT InvNoFalseSuspendSuccess
