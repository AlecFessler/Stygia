\* Companion to q7: LiveTerm at the SAME scope with the directive protocol
\* ON (and cycle rejection enabled). Isolates whether LiveTerm depends on
\* the directive path at all.
\* Per-property MINIMAL fairness at 2 cores x 3 ECs (round-7 follow-up).
\* The verdict records exactly which assumptions it rests on.
SPECIFICATION SpecTrm
CONSTANTS
  Cores = {c1, c2}
  ECs = {e1, e2, e3}
  NULL = NULL
  VCPU_ECS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = TRUE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 2
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvS4Holder
INVARIANT InvNoLostOneShot
INVARIANT InvRetiredPdOrdered
INVARIANT InvNoUAF
PROPERTY LiveTerm
