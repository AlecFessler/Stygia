\* VALIDATION GATE, X1 (revision 3: no pin gate, no pended state).
\* Expected result: TLC violates InvS4Holder -- a requeue-preempted claim
\* holder is retired and inline-finalized, orphaning its claim.
\* Run with -deadlock (deadlock detection OFF) so the shallower X2 cycle
\* does not shadow this finding.
SPECIFICATION SpecNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = FALSE
  PIN_GATE = FALSE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = FALSE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 1
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "self"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
  WAKE_IPI = TRUE
  RESTART_ON = FALSE
  G16_ON = FALSE
  G16_DROP_REF = FALSE
INVARIANT TypeOK
INVARIANT InvS4Holder
