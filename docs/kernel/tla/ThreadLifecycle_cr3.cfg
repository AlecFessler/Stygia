\* THE QUESTION THAT DECIDES SUFFICIENCY (round-7 maintainer proposal):
\* symmetric-suspend rejection is PAIRWISE -- a suspender checks whether
\* its own directive is already claimed by its target. That detects
\* 2-cycles. A 3-cycle (a suspends b, b suspends c, c suspends a) passes
\* every pairwise check individually. 2 cores x 3 Threads, directive only,
\* CYCLE_REJECT = "pair". If InvNoSuspendCycle3 is VIOLATED here, the
\* mechanism closes the shape that was found, not the class.
SPECIFICATION SpecDirNF
CONSTANTS
  Cores = {c1, c2}
  Threads = {e1, e2, e3}
  NULL = NULL
  VCPU_THREADS = {}
  VCPU_CANCEL = TRUE
  PENDED = TRUE
  PIN_GATE = TRUE
  SUSPEND_ON = FALSE
  REQUEUE_ON = FALSE
  FASTPATH = FALSE
  RV_ON = FALSE
  DIR_ON = TRUE
  PINLOCK_ON = FALSE
  S7_ON = FALSE
  DROP_BUDGET = 1
  TERM_BUDGET = 0
  CR_BUDGET = 0
  F1_MODE = "rev5"
  E4_AT_HOP = TRUE
  FIN_UNWIND = TRUE
  PIN_BUMP_FIRST = TRUE
  CYCLE_REJECT = "pair"
  TERM_ESCAPE = TRUE
  DIR_DROP = TRUE
  DIR_OWNED = TRUE
  DIR_GENCHK = TRUE
INVARIANT TypeOK
INVARIANT InvNoSuspendCycle2
INVARIANT InvNoSuspendCycle3
